[project]
name = "agent-voice"
version = "0.1.0"
description = "Local, privacy-first text-to-speech for coding agents, powered by Kokoro."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["kokoro-onnx==0.6.1"]

[project.scripts]
agent-voice = "agent_voice.cli:run"

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses real local resources (Kokoro model files, the herdr session); skipped when absent"]

[tool.coverage.run]
branch = true
source = ["agent_voice"]
