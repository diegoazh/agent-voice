# Local security gate. Install once: `uv tool install pre-commit && pre-commit install`
# Run everything manually:          `pre-commit run --all-files`
repos:
  # Secret detection on staged changes (fast, offline). Uses .gitleaks.toml automatically.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Multi-language SAST using registry rulesets (no committed rules to maintain).
  # --error makes findings fail the commit; --severity ERROR limits blocking to high-confidence/high-impact.
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.176.0
    hooks:
      - id: semgrep
        args: ["--config", "p/python", "--config", "p/security-audit", "--severity", "ERROR", "--error", "--quiet"]

  # Python-specific SAST, scoped to application code. Config lives in pyproject.toml [tool.bandit].
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false  # scan all of src/ so rules see full context
